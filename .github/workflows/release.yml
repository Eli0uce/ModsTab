name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 20, cache: npm }
      - uses: actions/setup-go@v7
        with: { go-version: "1.22.x" }
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: go test ./...
      - run: go vet ./...
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui -- --workers=1

  package:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Construire les archives existantes
        run: |
          chmod +x Install-macOS.command
          zip -r ModsTab.zip plugin installer Install-Windows.bat Install-macOS.command README.md LICENSE
          zip -r ModsTab-Windows.zip plugin installer Install-Windows.bat README.md LICENSE
          zip -r ModsTab-macOS.zip plugin installer Install-macOS.command README.md LICENSE
      - uses: actions/upload-artifact@v7
        with:
          name: release-packages
          path: |
            ModsTab.zip
            ModsTab-Windows.zip
            ModsTab-macOS.zip
            plugin/ModsTab.plugin.js
          retention-days: 1

  windows-installer:
    needs: validate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version: "1.22.x" }
      - name: Construire le lanceur Windows
        run: go build -trimpath -ldflags="-s -w" -o ModsTab-Setup.exe .
      - name: Signer le lanceur Windows
        env:
          WINDOWS_SIGNING_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_BASE64 }}
          WINDOWS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
        shell: pwsh
        run: |
          if (-not $env:WINDOWS_SIGNING_CERTIFICATE_BASE64 -or -not $env:WINDOWS_SIGNING_CERTIFICATE_PASSWORD) {
            throw "Configurez les secrets WINDOWS_SIGNING_CERTIFICATE_BASE64 et WINDOWS_SIGNING_CERTIFICATE_PASSWORD avant de créer une release."
          }
          $certificate = Join-Path $env:RUNNER_TEMP "modstab-signing.pfx"
          [IO.File]::WriteAllBytes($certificate, [Convert]::FromBase64String($env:WINDOWS_SIGNING_CERTIFICATE_BASE64))
          $sdkBin = "${env:ProgramFiles(x86)}\Windows Kits\10\bin"
          $signtool = Get-ChildItem $sdkBin -Filter signtool.exe -Recurse |
            Where-Object { $_.FullName -match "\\x64\\signtool\.exe$" } |
            Sort-Object FullName -Descending |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $signtool) { throw "SignTool est introuvable dans le SDK Windows." }
          & $signtool sign /fd SHA256 /td SHA256 /tr "http://timestamp.digicert.com" /f $certificate /p $env:WINDOWS_SIGNING_CERTIFICATE_PASSWORD ModsTab-Setup.exe
          if ($LASTEXITCODE -ne 0) { throw "La signature Authenticode a échoué." }
          & $signtool verify /pa /v ModsTab-Setup.exe
          if ($LASTEXITCODE -ne 0) { throw "La vérification Authenticode a échoué." }
          Remove-Item $certificate -Force
      - uses: actions/upload-artifact@v7
        with:
          name: windows-installer
          path: ModsTab-Setup.exe
          retention-days: 1

  macos-installer:
    needs: validate
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version: "1.22.x" }
      - name: Construire l’app universelle
        run: |
          GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o "$RUNNER_TEMP/ModsTab-arm64" .
          GOOS=darwin GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o "$RUNNER_TEMP/ModsTab-amd64" .
          mkdir -p ModsTab.app/Contents/MacOS
          lipo -create "$RUNNER_TEMP/ModsTab-arm64" "$RUNNER_TEMP/ModsTab-amd64" -output ModsTab.app/Contents/MacOS/ModsTab
          cat > ModsTab.app/Contents/Info.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key><string>ModsTab</string>
            <key>CFBundleIdentifier</key><string>nc.studio-karasu.modstab</string>
            <key>CFBundleName</key><string>ModsTab</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>${GITHUB_REF_NAME#v}</string>
            <key>LSMinimumSystemVersion</key><string>10.15</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          PLIST
      - name: Signer et notariser l’app macOS
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$APPLE_CERTIFICATE_BASE64" ] || [ -z "$APPLE_CERTIFICATE_PASSWORD" ] ||
             [ -z "$APPLE_ID" ] || [ -z "$APPLE_APP_SPECIFIC_PASSWORD" ] || [ -z "$APPLE_TEAM_ID" ]; then
            echo "Configurez les secrets Apple de signature et notarisation avant de créer une release." >&2
            exit 1
          fi
          certificate="$RUNNER_TEMP/modstab-signing.p12"
          keychain="$RUNNER_TEMP/modstab-signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          printf '%s' "$APPLE_CERTIFICATE_BASE64" | base64 --decode > "$certificate"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security list-keychains -d user -s "$keychain"
          identity="$(security find-identity -v -p codesigning "$keychain" | awk -F '"' '/Developer ID Application/ { print $2; exit }')"
          if [ -z "$identity" ]; then
            echo "Le certificat importé doit être un certificat Developer ID Application." >&2
            exit 1
          fi
          codesign --force --options runtime --timestamp --sign "$identity" ModsTab.app
          codesign --verify --deep --strict --verbose=2 ModsTab.app
          hdiutil create -volname ModsTab -srcfolder ModsTab.app -ov -format UDZO ModsTab-macOS.dmg
          xcrun notarytool submit ModsTab-macOS.dmg --apple-id "$APPLE_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
          xcrun stapler staple ModsTab-macOS.dmg
          xcrun stapler validate ModsTab-macOS.dmg
          rm -f "$certificate"
          security delete-keychain "$keychain"
      - uses: actions/upload-artifact@v7
        with:
          name: macos-installer
          path: ModsTab-macOS.dmg
          retention-days: 1

  publish:
    needs: [package, windows-installer, macos-installer]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: release-packages
          path: release-assets
      - uses: actions/download-artifact@v8
        with:
          name: windows-installer
          path: release-assets
      - uses: actions/download-artifact@v8
        with:
          name: macos-installer
          path: release-assets
      - name: Calculer les empreintes
        working-directory: release-assets
        run: sha256sum ModsTab*.zip ModsTab-Setup.exe ModsTab-macOS.dmg plugin/ModsTab.plugin.js > SHA256SUMS.txt
      - name: Publier la release
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: release-assets
        run: gh release create "${GITHUB_REF_NAME}" ModsTab.zip ModsTab-Windows.zip ModsTab-macOS.zip ModsTab-Setup.exe ModsTab-macOS.dmg plugin/ModsTab.plugin.js SHA256SUMS.txt --title "ModsTab ${GITHUB_REF_NAME}" --notes-file ../.github/RELEASE_NOTES.md
