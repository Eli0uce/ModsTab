name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 20, cache: npm }
      - uses: actions/setup-go@v7
        with: { go-version: "1.22.x" }
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: go test ./...
      - run: go vet ./...
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui -- --workers=1

  package:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Construire les archives existantes
        run: |
          chmod +x Install-macOS.command
          zip -r ModsTab.zip plugin installer Install-Windows.bat Install-macOS.command README.md LICENSE
          zip -r ModsTab-Windows.zip plugin installer Install-Windows.bat README.md LICENSE
          zip -r ModsTab-macOS.zip plugin installer Install-macOS.command README.md LICENSE
      - uses: actions/upload-artifact@v7
        with:
          name: release-packages
          path: |
            ModsTab.zip
            ModsTab-Windows.zip
            ModsTab-macOS.zip
            plugin/ModsTab.plugin.js
          retention-days: 1

  windows-installer:
    needs: validate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version: "1.22.x" }
      - name: Construire le lanceur Windows
        run: go build -trimpath -ldflags="-s -w" -o ModsTab-Setup.exe .
      - uses: actions/upload-artifact@v7
        with:
          name: windows-installer
          path: ModsTab-Setup.exe
          retention-days: 1

  macos-installer:
    needs: validate
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version: "1.22.x" }
      - name: Construire l’app universelle non signée
        run: |
          GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o "$RUNNER_TEMP/ModsTab-arm64" .
          GOOS=darwin GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o "$RUNNER_TEMP/ModsTab-amd64" .
          mkdir -p ModsTab.app/Contents/MacOS
          lipo -create "$RUNNER_TEMP/ModsTab-arm64" "$RUNNER_TEMP/ModsTab-amd64" -output ModsTab.app/Contents/MacOS/ModsTab
          cat > ModsTab.app/Contents/Info.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key><string>ModsTab</string>
            <key>CFBundleIdentifier</key><string>nc.studio-karasu.modstab</string>
            <key>CFBundleName</key><string>ModsTab</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>${GITHUB_REF_NAME#v}</string>
            <key>LSMinimumSystemVersion</key><string>10.15</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          PLIST
          hdiutil create -volname ModsTab -srcfolder ModsTab.app -ov -format UDZO ModsTab-macOS.dmg
      - uses: actions/upload-artifact@v7
        with:
          name: macos-installer
          path: ModsTab-macOS.dmg
          retention-days: 1

  publish:
    needs: [package, windows-installer, macos-installer]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: release-packages
          path: release-assets
      - uses: actions/download-artifact@v8
        with:
          name: windows-installer
          path: release-assets
      - uses: actions/download-artifact@v8
        with:
          name: macos-installer
          path: release-assets
      - name: Calculer les empreintes
        working-directory: release-assets
        run: sha256sum ModsTab*.zip ModsTab-Setup.exe ModsTab-macOS.dmg plugin/ModsTab.plugin.js > SHA256SUMS.txt
      - name: Publier la release
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: release-assets
        run: gh release create "${GITHUB_REF_NAME}" ModsTab.zip ModsTab-Windows.zip ModsTab-macOS.zip ModsTab-Setup.exe ModsTab-macOS.dmg plugin/ModsTab.plugin.js SHA256SUMS.txt --title "ModsTab ${GITHUB_REF_NAME}" --notes-file ../.github/RELEASE_NOTES.md
