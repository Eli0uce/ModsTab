name: Checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 20 }
      - uses: actions/setup-go@v7
        with: { go-version: "1.22.x" }
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: go test ./...
      - run: go vet ./...
      - run: GOOS=windows GOARCH=amd64 go build -o /tmp/ModsTab-Setup.exe .
      - run: GOOS=darwin GOARCH=arm64 go build -o /tmp/ModsTab-arm64 .
      - run: GOOS=darwin GOARCH=amd64 go build -o /tmp/ModsTab-amd64 .
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui -- --workers=1
